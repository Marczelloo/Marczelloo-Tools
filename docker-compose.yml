version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marczelloo-tools
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist tmp directory for file processing
      - tmp-data:/app/tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  tmp-data:
    driver: local
