version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: marczelloo-tools-dev
    restart: "no"
    environment:
      - NODE_ENV=development
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules
      - /app/.next
      # Preserve tmp directories from image (uploads, processed, ffmpeg)
      - /app/tmp
      # Persist tmp data across container restarts
      - tmp-data:/app/tmp-persist
    command: ["pnpm", "dev"]

volumes:
  tmp-data:

